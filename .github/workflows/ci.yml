name: CI

on:
  push:
    branches-ignore: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deduplicate:
    name: Determine CI coverage
    runs-on: self-hosted
    outputs:
      run_quality: ${{ steps.coverage.outputs.run_quality }}
    steps:
      - id: coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'run_quality=true' >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != push ]; then exit 0; fi
          for base in main beta; do
            if response="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' --get --data-urlencode state=open --data-urlencode "base=${base}" --data-urlencode "head=${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls")"; then
              if printf '%s' "$response" | jq -e --arg base "$base" --arg sha "$GITHUB_SHA" 'type == "array" and any(.[]; .base.ref == $base and .head.sha == $sha)' >/dev/null; then
                echo 'run_quality=false' >> "$GITHUB_OUTPUT"; exit 0
              fi
            else
              echo "Unable to check open ${base} pull requests; running quality." >&2; exit 0
            fi
          done

  pipeline:
    name: Container pipeline
    needs: deduplicate
    if: needs.deduplicate.outputs.run_quality == 'true'
    uses: ./.github/workflows/build-container.yml
    with:
      build_images: ${{ github.event_name == 'pull_request' }}
      caller_event: ${{ github.event_name }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  backend-status:
    name: Backend Quality and Tests
    needs: [deduplicate, pipeline]
    if: >-
      always() &&
      (github.event_name != 'push' || needs.deduplicate.result != 'success' || needs.deduplicate.outputs.run_quality != 'false')
    runs-on: self-hosted
    steps:
      - name: Verify backend quality result
        shell: bash
        run: |
          test "${{ needs.pipeline.result }}" = success
          test "${{ needs.pipeline.outputs.backend_result }}" = success

  frontend-status:
    name: Frontend Build
    needs: [deduplicate, pipeline]
    if: >-
      always() &&
      (github.event_name != 'push' || needs.deduplicate.result != 'success' || needs.deduplicate.outputs.run_quality != 'false')
    runs-on: self-hosted
    steps:
      - name: Verify frontend quality result
        shell: bash
        run: |
          test "${{ needs.pipeline.result }}" = success
          test "${{ needs.pipeline.outputs.frontend_result }}" = success
