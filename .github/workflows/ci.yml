name: CI

on:
  pull_request:
    branches: [beta, main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bases:
    name: Resolve dependency images
    uses: ./.github/workflows/base-images.yml
    with:
      use_harbor: false

  quality:
    name: Quality
    needs: bases
    uses: ./.github/workflows/quality.yml
    with:
      frontend_image: ${{ needs.bases.outputs.frontend_image }}
      python_ci_image: ${{ needs.bases.outputs.python_ci_image }}
      production_image: ${{ needs.bases.outputs.production_image }}
      use_harbor: false
      cache_scope: ${{ github.base_ref || github.ref_name }}
      cache_fallback: main

  gate:
    name: CI Gate
    needs: [bases, quality]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Verify CI results
        shell: bash
        env:
          BASES_RESULT: ${{ needs.bases.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BACKEND_RESULT: ${{ needs.quality.outputs.backend_result }}
          FRONTEND_RESULT: ${{ needs.quality.outputs.frontend_result }}
          STORAGE_RESULT: ${{ needs.quality.outputs.storage_result }}
        run: |
          set -euo pipefail
          test "$BASES_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$STORAGE_RESULT" = success
