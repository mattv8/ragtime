name: Build and Push Container

on:
  push:
    branches: [main, beta]
  workflow_dispatch:
    inputs:
      build_images: {description: 'Build application and runtime candidates.', required: false, type: boolean, default: true}
      build_legacy_image: {description: 'Build the legacy CPU image.', required: false, type: boolean, default: false}
      release_bump: {description: 'Stable main release bump override.', required: false, type: choice, options: [auto, patch, minor, major], default: auto}

env:
  REGISTRY: hub.docker.visnovsky.us
  IMAGE_NAME: library/ragtime
  IMAGE_RUNTIME_NAME: library/runtime
  IMAGE_STORAGE_NAME: library/ragtime-storage

permissions:
  actions: read
  contents: read

jobs:
  plan:
    name: Determine publication plan
    runs-on: self-hosted
    outputs:
      trusted: ${{ steps.plan.outputs.trusted }}
      branch: ${{ steps.plan.outputs.branch }}
      short_sha: ${{ steps.plan.outputs.short_sha }}
      environment: ${{ steps.plan.outputs.environment }}
      cache_scope: ${{ steps.plan.outputs.cache_scope }}
      cache_fallback: ${{ steps.plan.outputs.cache_fallback }}
      build_main: ${{ steps.plan.outputs.build_main }}
      build_runtime: ${{ steps.plan.outputs.build_runtime }}
      build_legacy: ${{ steps.plan.outputs.build_legacy }}
      promote: ${{ steps.plan.outputs.promote }}
      app_tags: ${{ steps.plan.outputs.app_tags }}
      runtime_tags: ${{ steps.plan.outputs.runtime_tags }}
      legacy_tag: ${{ steps.plan.outputs.legacy_tag }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          BUILD_IMAGES: ${{ inputs.build_images || false }}
          BUILD_LEGACY: ${{ inputs.build_legacy_image || false }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ] && { [ "$GITHUB_REF_NAME" = main ] || [ "$GITHUB_REF_NAME" = beta ]; }; then BUILD_IMAGES=true; fi
          python3 docker/scripts/ci_build_plan.py --event "$GITHUB_EVENT_NAME" --ref-name "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --build-images "$BUILD_IMAGES" --build-legacy "$BUILD_LEGACY" >> "$GITHUB_OUTPUT"

  bases:
    name: Prepare dependency images
    uses: ./.github/workflows/base-images.yml
    with:
      use_harbor: true
    secrets: inherit

  main-release-guard:
    name: Validate main release input
    needs: plan
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.build_main == 'true' &&
      needs.plan.outputs.branch == 'main'
    runs-on: self-hosted
    steps:
      - name: Reject branch-creation push
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          [ "$GITHUB_EVENT_NAME" != push ] || [ "$EVENT_BEFORE" != 0000000000000000000000000000000000000000 ] || { echo 'Refusing to release a branch-creation push.' >&2; exit 1; }

  quality:
    name: Revalidate main quality
    needs: [bases, plan, main-release-guard]
    if: >-
      !cancelled() && needs.bases.result == 'success' && needs.plan.result == 'success' &&
      needs.main-release-guard.result == 'success'
    uses: ./.github/workflows/quality.yml
    with:
      frontend_image: ${{ needs.bases.outputs.frontend_image }}
      python_ci_image: ${{ needs.bases.outputs.python_ci_image }}
      production_image: ${{ needs.bases.outputs.production_image }}
      use_harbor: true
      cache_scope: main
      cache_fallback: main
    secrets: inherit

  release-plan:
    name: Plan stable version
    needs: [plan, main-release-guard]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.main-release-guard.result == 'success'
    runs-on: self-hosted
    permissions: {contents: read, pull-requests: read}
    outputs: {tag: '${{ steps.version.outputs.tag }}'}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, fetch-tags: true}
      - id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_INITIAL_VERSION: ${{ vars.RELEASE_INITIAL_VERSION || '1.0.0' }}
          RELEASE_BUMP: ${{ inputs.release_bump || 'auto' }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          plan="$(python3 docker/scripts/publish_release.py --plan --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --initial-version "$RELEASE_INITIAL_VERSION" --bump "$RELEASE_BUMP")"
          python3 -c 'import json, sys; print("tag=" + json.load(sys.stdin)["tag"])' <<< "$plan" >> "$GITHUB_OUTPUT"

  candidate-main:
    name: Build application candidate
    needs: [bases, plan]
    if: >-
      !cancelled() && needs.bases.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.build_main == 'true'
    runs-on: self-hosted
    permissions: {actions: read, contents: read, packages: write}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}
      branch: ${{ steps.meta.outputs.branch }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/managed-buildx
        with: {scope: candidate-main}
      - name: Validate resolved base references
        env:
          FRONTEND: ${{ needs.bases.outputs.frontend_image }}
          PYTHON_CI: ${{ needs.bases.outputs.python_ci_image }}
          PRODUCTION: ${{ needs.bases.outputs.production_image }}
        run: |
          set -euo pipefail
          for image in "$FRONTEND" "$PYTHON_CI" "$PRODUCTION"; do case "$image" in *@sha256:*) ;; *) exit 1;; esac; done
      - id: meta
        run: printf 'image=%s\nbranch=%s\n' "${REGISTRY}/${IMAGE_NAME}" '${{ needs.plan.outputs.branch }}' >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: {registry: '${{ env.REGISTRY }}', username: '${{ secrets.HARBOR_USERNAME }}', password: '${{ secrets.HARBOR_PASSWORD }}'}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            FRONTEND_DEPS_IMAGE=${{ needs.bases.outputs.frontend_image }}
            PYTHON_CI_DEPS_IMAGE=${{ needs.bases.outputs.python_ci_image }}
            PRODUCTION_DEPS_IMAGE=${{ needs.bases.outputs.production_image }}
            APP_VERSION=${{ needs.plan.outputs.short_sha }}
            ENVIRONMENT=${{ needs.plan.outputs.environment }}
          platforms: linux/amd64
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-app-${{ needs.plan.outputs.cache_scope }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-app-${{ needs.plan.outputs.cache_fallback }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-app-${{ needs.plan.outputs.cache_scope }},mode=max,oci-mediatypes=true,image-manifest=true,compression=zstd
          sbom: generator=docker.io/docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

  candidate-runtime:
    name: Build runtime candidate
    needs: [bases, plan]
    if: >-
      !cancelled() && needs.bases.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.build_runtime == 'true'
    runs-on: self-hosted
    permissions: {actions: read, contents: read, packages: write}
    outputs: {digest: '${{ steps.build.outputs.digest }}', image: '${{ env.REGISTRY }}/${{ env.IMAGE_RUNTIME_NAME }}'}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/managed-buildx
        with: {scope: candidate-runtime}
      - name: Validate resolved runtime base reference
        env:
          RUNTIME_DEPS: ${{ needs.bases.outputs.runtime_image }}
        run: |
          set -euo pipefail
          case "$RUNTIME_DEPS" in *@sha256:*) ;; *) exit 1;; esac
      - uses: docker/login-action@v3
        with: {registry: '${{ env.REGISTRY }}', username: '${{ secrets.HARBOR_USERNAME }}', password: '${{ secrets.HARBOR_PASSWORD }}'}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.runtime
          push: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_RUNTIME_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            RUNTIME_DEPS_IMAGE=${{ needs.bases.outputs.runtime_image }}
          platforms: linux/amd64
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_RUNTIME_NAME }}:buildcache-runtime-${{ needs.plan.outputs.cache_scope }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_RUNTIME_NAME }}:buildcache-runtime-${{ needs.plan.outputs.cache_fallback }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_RUNTIME_NAME }}:buildcache-runtime-${{ needs.plan.outputs.cache_scope }},mode=max,oci-mediatypes=true,image-manifest=true,compression=zstd

  candidate-storage:
    name: Build object-storage candidate
    needs: [bases, plan]
    if: >-
      !cancelled() && needs.bases.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.build_main == 'true'
    runs-on: self-hosted
    permissions: {actions: read, contents: read, packages: write}
    outputs: {digest: '${{ steps.build.outputs.digest }}', image: '${{ env.REGISTRY }}/${{ env.IMAGE_STORAGE_NAME }}'}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/managed-buildx
        with: {scope: candidate-storage}
      - uses: docker/login-action@v3
        with: {registry: '${{ env.REGISTRY }}', username: '${{ secrets.HARBOR_USERNAME }}', password: '${{ secrets.HARBOR_PASSWORD }}'}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.storage
          push: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_STORAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: MAVEN_SKIP_TESTS=1
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_STORAGE_NAME }}:buildcache-storage-${{ needs.plan.outputs.cache_scope }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_STORAGE_NAME }}:buildcache-storage-${{ needs.plan.outputs.cache_scope }},mode=max,oci-mediatypes=true,image-manifest=true,compression=zstd

  candidate-legacy:
    name: Build legacy candidate
    needs: [bases, plan]
    if: >-
      !cancelled() && needs.bases.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.build_legacy == 'true'
    runs-on: self-hosted
    permissions: {actions: read, contents: read, packages: write}
    outputs: {digest: '${{ steps.build.outputs.digest }}'}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/managed-buildx
        with: {scope: candidate-legacy}
      - uses: docker/login-action@v3
        with: {registry: '${{ env.REGISTRY }}', username: '${{ secrets.HARBOR_USERNAME }}', password: '${{ secrets.HARBOR_PASSWORD }}'}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            LEGACY_CPU=1
            APP_VERSION=${{ needs.plan.outputs.short_sha }}
            ENVIRONMENT=${{ needs.plan.outputs.environment }}
          no-cache: true

  sbom:
    name: Extract BuildKit SBOM
    needs: candidate-main
    if: '!cancelled() && needs.candidate-main.result == ''success'''
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/managed-buildx
        with: {scope: sbom}
      - uses: docker/login-action@v3
        with: {registry: '${{ env.REGISTRY }}', username: '${{ secrets.HARBOR_USERNAME }}', password: '${{ secrets.HARBOR_PASSWORD }}'}
      - run: docker buildx imagetools inspect --format '{{json .SBOM}}' '${{ needs.candidate-main.outputs.image }}@${{ needs.candidate-main.outputs.digest }}' > sbom.inspect.json
      - run: python3 docker/scripts/extract_build_sbom.py sbom.inspect.json sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with: {name: 'sbom-${{ needs.candidate-main.outputs.branch }}', path: sbom.spdx.json, retention-days: 90}

  promote:
    name: Promote, sign, and tag candidates
    needs: [plan, candidate-main, candidate-runtime, candidate-storage, candidate-legacy, sbom, main-release-guard, quality, release-plan]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.promote == 'true' &&
      ((needs.plan.outputs.build_main == 'true' && github.ref_name == 'main' && needs.main-release-guard.result == 'success' && needs.quality.result == 'success' && needs.quality.outputs.backend_result == 'success' && needs.quality.outputs.frontend_result == 'success' && needs.quality.outputs.storage_result == 'success' && needs.release-plan.result == 'success') || ((needs.plan.outputs.build_main != 'true' || github.ref_name != 'main') && needs.main-release-guard.result == 'skipped' && needs.quality.result == 'skipped' && needs.release-plan.result == 'skipped')) &&
      ((needs.plan.outputs.build_main == 'true' && needs.candidate-main.result == 'success' && needs.sbom.result == 'success') || (needs.plan.outputs.build_main != 'true' && needs.candidate-main.result == 'skipped' && needs.sbom.result == 'skipped')) &&
      ((needs.plan.outputs.build_runtime == 'true' && needs.candidate-runtime.result == 'success') || (needs.plan.outputs.build_runtime != 'true' && needs.candidate-runtime.result == 'skipped')) &&
      ((needs.plan.outputs.build_main == 'true' && needs.candidate-storage.result == 'success') || (needs.plan.outputs.build_main != 'true' && needs.candidate-storage.result == 'skipped')) &&
      ((needs.plan.outputs.build_legacy == 'true' && needs.candidate-legacy.result == 'success') || (needs.plan.outputs.build_legacy != 'true' && needs.candidate-legacy.result == 'skipped'))
    runs-on: self-hosted
    concurrency:
      group: harbor-moving-tags-${{ github.ref_name }}
      cancel-in-progress: false
    permissions: {actions: read, contents: write, id-token: write, packages: write, pull-requests: read}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, fetch-tags: true}
      - uses: ./.github/actions/managed-buildx
        with: {scope: promote}
      - uses: docker/login-action@v3
        with: {registry: '${{ env.REGISTRY }}', username: '${{ secrets.HARBOR_USERNAME }}', password: '${{ secrets.HARBOR_PASSWORD }}'}
      - name: Reject stale branch ref
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
      - uses: sigstore/cosign-installer@v3
        with: {cosign-release: v2.4.1}
      - name: Publish stable digest-pinned release
        if: needs.plan.outputs.build_main == 'true' && github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          APP: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          RUNTIME: ${{ env.REGISTRY }}/${{ env.IMAGE_RUNTIME_NAME }}
          STORAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_STORAGE_NAME }}
          APP_DIGEST: ${{ needs.candidate-main.outputs.digest }}
          RUNTIME_DIGEST: ${{ needs.candidate-runtime.outputs.digest }}
          STORAGE_DIGEST: ${{ needs.candidate-storage.outputs.digest }}
          LEGACY_DIGEST: ${{ needs.candidate-legacy.outputs.digest }}
          RELEASE_INITIAL_VERSION: ${{ vars.RELEASE_INITIAL_VERSION || '1.0.0' }}
          RELEASE_BUMP: ${{ inputs.release_bump || 'auto' }}
          EXPECTED_TAG: ${{ needs.release-plan.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          python3 docker/scripts/publish_release.py --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --expected-tag "$EXPECTED_TAG" --initial-version "$RELEASE_INITIAL_VERSION" --bump "$RELEASE_BUMP" --app "$APP" --runtime "$RUNTIME" --storage "$STORAGE" --app-digest "$APP_DIGEST" --runtime-digest "$RUNTIME_DIGEST" --storage-digest "$STORAGE_DIGEST" --legacy-digest "$LEGACY_DIGEST"
      - name: Promote beta candidates
        if: needs.plan.outputs.build_main == 'true' && github.ref_name == 'beta'
        env:
          APP: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          RUNTIME: ${{ env.REGISTRY }}/${{ env.IMAGE_RUNTIME_NAME }}
          STORAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_STORAGE_NAME }}
          APP_DIGEST: ${{ needs.candidate-main.outputs.digest }}
          RUNTIME_DIGEST: ${{ needs.candidate-runtime.outputs.digest }}
          STORAGE_DIGEST: ${{ needs.candidate-storage.outputs.digest }}
          APP_TAGS: ${{ needs.plan.outputs.app_tags }}
          RUNTIME_TAGS: ${{ needs.plan.outputs.runtime_tags }}
        run: |
          set -euo pipefail
          promote() { local image="$1" digest="$2" tags="$3" tag args=(); IFS=, read -r -a tag_list <<< "$tags"; for tag in "${tag_list[@]}"; do args+=(--tag "$image:$tag"); done; docker buildx imagetools create "${args[@]}" "$image@$digest"; for tag in "${tag_list[@]}"; do test "$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$image:$tag")" = "$digest"; done; }
          promote "$APP" "$APP_DIGEST" "$APP_TAGS"
          promote "$RUNTIME" "$RUNTIME_DIGEST" "$RUNTIME_TAGS"
          promote "$STORAGE" "$STORAGE_DIGEST" "$APP_TAGS"
      - name: Sign beta promoted digests
        if: needs.plan.outputs.build_main == 'true' && github.ref_name == 'beta'
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          APP: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          RUNTIME: ${{ env.REGISTRY }}/${{ env.IMAGE_RUNTIME_NAME }}
          STORAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_STORAGE_NAME }}
          APP_DIGEST: ${{ needs.candidate-main.outputs.digest }}
          RUNTIME_DIGEST: ${{ needs.candidate-runtime.outputs.digest }}
          STORAGE_DIGEST: ${{ needs.candidate-storage.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$APP@$APP_DIGEST"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$RUNTIME@$RUNTIME_DIGEST"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$STORAGE@$STORAGE_DIGEST"
      - name: Maintain legacy image only
        if: needs.plan.outputs.build_main != 'true' && needs.plan.outputs.build_legacy == 'true'
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          APP: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          LEGACY_DIGEST: ${{ needs.candidate-legacy.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$APP@$LEGACY_DIGEST"
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          cosign public-key --key env://COSIGN_PRIVATE_KEY --outfile "$key_file"
          cosign verify --key "$key_file" "$APP@$LEGACY_DIGEST"
          docker buildx imagetools create --tag "$APP:legacy" "$APP@$LEGACY_DIGEST"
