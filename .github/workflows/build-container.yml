name: Build and Push Container

on:
  workflow_call:
    inputs:
      build_images: {description: 'Publish candidates and promote them when allowed.', required: false, type: boolean, default: false}
      caller_event: {description: 'Non-empty only when invoked by the top-level CI workflow.', required: false, type: string, default: ''}
      build_legacy_image: {description: 'Build the legacy CPU image.', required: false, type: boolean, default: false}
    outputs:
      backend_result: {value: '${{ jobs.quality.outputs.backend_result }}'}
      frontend_result: {value: '${{ jobs.quality.outputs.frontend_result }}'}
      container_changed: {value: '${{ jobs.scope.outputs.container_changed }}'}
  push:
    branches: [main, beta]
    paths:
      - 'docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.jscpd.json'
      - 'ragtime/**'
      - 'runtime/**'
      - 'tests/**'
      - 'typings/**'
      - 'pyproject.toml'
      - '.env.example'
      - 'README.md'
      - 'prisma/**'
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      build_images: {description: 'Build application and runtime candidates.', required: false, type: boolean, default: true}
      build_legacy_image: {description: 'Build the legacy CPU image.', required: false, type: boolean, default: false}

env:
  REGISTRY: hub.docker.visnovsky.us
  IMAGE_NAME: library/ragtime
  IMAGE_RUNTIME_NAME: library/runtime

permissions:
  actions: read
  contents: read

jobs:
  trust:
    name: Determine registry access
    runs-on: self-hosted
    outputs:
      use_harbor: ${{ steps.access.outputs.use_harbor }}
    steps:
      - id: access
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || [ '${{ github.event.pull_request.head.repo.full_name }}' = "$GITHUB_REPOSITORY" ]; then
            echo use_harbor=true >> "$GITHUB_OUTPUT"
          else
            echo use_harbor=false >> "$GITHUB_OUTPUT"
          fi

  scope:
    name: Determine candidate scope
    runs-on: self-hosted
    outputs:
      container_changed: ${{ steps.scope.outputs.container_changed }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then result="$(python3 docker/scripts/changed_lint_files.py --all)"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then result="$(python3 docker/scripts/changed_lint_files.py --merge-base --base-ref '${{ github.event.pull_request.base.sha }}' --head-ref '${{ github.event.pull_request.head.sha }}')"
          else result="$(python3 docker/scripts/changed_lint_files.py --base-ref '${{ github.event.before }}' --head-ref '${{ github.sha }}')"; fi
          printf '%s\n' "$result" | while IFS= read -r line; do case "$line" in container_changed=*) printf '%s\n' "$line" >> "$GITHUB_OUTPUT";; esac; done

  plan:
    name: Determine publication plan
    needs: [scope, trust]
    runs-on: self-hosted
    outputs:
      trusted: ${{ steps.plan.outputs.trusted }}
      branch: ${{ steps.plan.outputs.branch }}
      short_sha: ${{ steps.plan.outputs.short_sha }}
      environment: ${{ steps.plan.outputs.environment }}
      cache_scope: ${{ steps.plan.outputs.cache_scope }}
      cache_fallback: ${{ steps.plan.outputs.cache_fallback }}
      build_main: ${{ steps.plan.outputs.build_main }}
      build_runtime: ${{ steps.plan.outputs.build_runtime }}
      build_legacy: ${{ steps.plan.outputs.build_legacy }}
      promote: ${{ steps.plan.outputs.promote }}
      app_tags: ${{ steps.plan.outputs.app_tags }}
      runtime_tags: ${{ steps.plan.outputs.runtime_tags }}
      legacy_tag: ${{ steps.plan.outputs.legacy_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          BUILD_IMAGES: ${{ inputs.build_images || false }}
          BUILD_LEGACY: ${{ inputs.build_legacy_image || false }}
          CALLER_EVENT: ${{ inputs.caller_event }}
        run: |
          set -euo pipefail
          if [ -z "$CALLER_EVENT" ] && [ "$GITHUB_EVENT_NAME" = push ] && { [ "$GITHUB_REF_NAME" = main ] || [ "$GITHUB_REF_NAME" = beta ]; }; then BUILD_IMAGES=true; fi
          python3 docker/scripts/ci_build_plan.py --event "$GITHUB_EVENT_NAME" --ref-name "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --pr-repository '${{ github.event.pull_request.head.repo.full_name }}' --pr-number '${{ github.event.pull_request.number }}' --base-ref '${{ github.base_ref }}' --container-changed '${{ needs.scope.outputs.container_changed }}' --build-images "$BUILD_IMAGES" --build-legacy "$BUILD_LEGACY" >> "$GITHUB_OUTPUT"

  bases:
    name: Prepare dependency images
    needs: trust
    uses: ./.github/workflows/base-images.yml
    with:
      use_harbor: ${{ needs.trust.outputs.use_harbor == 'true' }}
    secrets: inherit

  quality:
    name: Quality
    needs: [bases, trust, plan]
    if: '!cancelled() && needs.bases.result == ''success'' && needs.trust.result == ''success'' && needs.plan.result == ''success'''
    uses: ./.github/workflows/quality.yml
    with:
      frontend_image: ${{ needs.bases.outputs.frontend_image }}
      python_ci_image: ${{ needs.bases.outputs.python_ci_image }}
      production_image: ${{ needs.bases.outputs.production_image }}
      use_harbor: ${{ needs.trust.outputs.use_harbor == 'true' }}
      cache_scope: ${{ needs.plan.outputs.cache_scope }}
      cache_fallback: ${{ needs.plan.outputs.cache_fallback }}
    secrets: inherit

  candidate-main:
    name: Build application candidate
    needs: [scope, bases, trust, plan]
    if: >-
      !cancelled() && needs.scope.result == 'success' && needs.bases.result == 'success' && needs.trust.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.build_main == 'true'
    runs-on: self-hosted
    permissions: {actions: read, contents: read, packages: write}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}
      branch: ${{ steps.meta.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/managed-buildx
        with: {scope: candidate-main}
      - name: Validate resolved base references
        env:
          FRONTEND: ${{ needs.bases.outputs.frontend_image }}
          PYTHON_CI: ${{ needs.bases.outputs.python_ci_image }}
          PRODUCTION: ${{ needs.bases.outputs.production_image }}
        run: |
          set -euo pipefail
          for image in "$FRONTEND" "$PYTHON_CI" "$PRODUCTION"; do case "$image" in *@sha256:*) ;; *) exit 1;; esac; done
      - id: meta
        run: printf 'image=%s\nbranch=%s\n' "${REGISTRY}/${IMAGE_NAME}" '${{ needs.plan.outputs.branch }}' >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: {registry: '${{ env.REGISTRY }}', username: '${{ secrets.HARBOR_USERNAME }}', password: '${{ secrets.HARBOR_PASSWORD }}'}
      - id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            FRONTEND_DEPS_IMAGE=${{ needs.bases.outputs.frontend_image }}
            PYTHON_CI_DEPS_IMAGE=${{ needs.bases.outputs.python_ci_image }}
            PRODUCTION_DEPS_IMAGE=${{ needs.bases.outputs.production_image }}
            APP_VERSION=${{ needs.plan.outputs.short_sha }}
            ENVIRONMENT=${{ needs.plan.outputs.environment }}
          platforms: linux/amd64
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-app-${{ needs.plan.outputs.cache_scope }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-app-${{ needs.plan.outputs.cache_fallback }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-app-${{ needs.plan.outputs.cache_scope }},mode=max,oci-mediatypes=true,image-manifest=true,compression=zstd
          sbom: generator=docker.io/docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

  candidate-runtime:
    name: Build runtime candidate
    needs: [scope, bases, trust, plan]
    if: >-
      !cancelled() && needs.scope.result == 'success' && needs.bases.result == 'success' && needs.trust.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.build_runtime == 'true'
    runs-on: self-hosted
    permissions: {actions: read, contents: read, packages: write}
    outputs: {digest: '${{ steps.build.outputs.digest }}', image: '${{ env.REGISTRY }}/${{ env.IMAGE_RUNTIME_NAME }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/managed-buildx
        with: {scope: candidate-runtime}
      - uses: docker/login-action@v3
        with: {registry: '${{ env.REGISTRY }}', username: '${{ secrets.HARBOR_USERNAME }}', password: '${{ secrets.HARBOR_PASSWORD }}'}
      - id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.runtime
          push: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_RUNTIME_NAME }},push-by-digest=true,name-canonical=true,push=true
          platforms: linux/amd64
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_RUNTIME_NAME }}:buildcache-runtime-${{ needs.plan.outputs.cache_scope }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_RUNTIME_NAME }}:buildcache-runtime-${{ needs.plan.outputs.cache_fallback }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_RUNTIME_NAME }}:buildcache-runtime-${{ needs.plan.outputs.cache_scope }},mode=max,oci-mediatypes=true,image-manifest=true,compression=zstd

  candidate-legacy:
    name: Build legacy candidate
    needs: [bases, trust, plan]
    if: >-
      !cancelled() && needs.bases.result == 'success' && needs.trust.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.build_legacy == 'true'
    runs-on: self-hosted
    permissions: {actions: read, contents: read, packages: write}
    outputs: {digest: '${{ steps.build.outputs.digest }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/managed-buildx
        with: {scope: candidate-legacy}
      - uses: docker/login-action@v3
        with: {registry: '${{ env.REGISTRY }}', username: '${{ secrets.HARBOR_USERNAME }}', password: '${{ secrets.HARBOR_PASSWORD }}'}
      - id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            LEGACY_CPU=1
            APP_VERSION=${{ needs.plan.outputs.short_sha }}
            ENVIRONMENT=${{ needs.plan.outputs.environment }}
          no-cache: true

  sbom:
    name: Extract BuildKit SBOM
    needs: candidate-main
    if: '!cancelled() && needs.candidate-main.result == ''success'''
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/managed-buildx
        with: {scope: sbom}
      - uses: docker/login-action@v3
        with: {registry: '${{ env.REGISTRY }}', username: '${{ secrets.HARBOR_USERNAME }}', password: '${{ secrets.HARBOR_PASSWORD }}'}
      - run: docker buildx imagetools inspect --format '{{json .SBOM}}' '${{ needs.candidate-main.outputs.image }}@${{ needs.candidate-main.outputs.digest }}' > sbom.inspect.json
      - run: python3 docker/scripts/extract_build_sbom.py sbom.inspect.json sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with: {name: 'sbom-${{ needs.candidate-main.outputs.branch }}', path: sbom.spdx.json, retention-days: 90}

  promote:
    name: Promote, sign, and tag candidates
    needs: [quality, plan, candidate-main, candidate-runtime, candidate-legacy, sbom]
    if: >-
      !cancelled() && needs.quality.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.promote == 'true' &&
      ((needs.plan.outputs.build_main == 'true' && needs.candidate-main.result == 'success' && needs.sbom.result == 'success') || (needs.plan.outputs.build_main != 'true' && needs.candidate-main.result == 'skipped' && needs.sbom.result == 'skipped')) &&
      ((needs.plan.outputs.build_runtime == 'true' && needs.candidate-runtime.result == 'success') || (needs.plan.outputs.build_runtime != 'true' && needs.candidate-runtime.result == 'skipped')) &&
      ((needs.plan.outputs.build_legacy == 'true' && needs.candidate-legacy.result == 'success') || (needs.plan.outputs.build_legacy != 'true' && needs.candidate-legacy.result == 'skipped'))
    runs-on: self-hosted
    concurrency:
      group: harbor-moving-tags-${{ github.ref_name }}
      cancel-in-progress: false
    permissions: {actions: read, contents: read, id-token: write, packages: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: ./.github/actions/managed-buildx
        with: {scope: promote}
      - uses: docker/login-action@v3
        with: {registry: '${{ env.REGISTRY }}', username: '${{ secrets.HARBOR_USERNAME }}', password: '${{ secrets.HARBOR_PASSWORD }}'}
      - name: Reject stale branch ref
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$(git ls-remote origin "refs/heads/$PR_HEAD_REF" | cut -f1)" = "$PR_HEAD_SHA"
          else
            test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          fi
      - name: Promote immutable candidates
        env:
          APP: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          RUNTIME: ${{ env.REGISTRY }}/${{ env.IMAGE_RUNTIME_NAME }}
          APP_DIGEST: ${{ needs.candidate-main.outputs.digest }}
          RUNTIME_DIGEST: ${{ needs.candidate-runtime.outputs.digest }}
          LEGACY_DIGEST: ${{ needs.candidate-legacy.outputs.digest }}
          APP_TAGS: ${{ needs.plan.outputs.app_tags }}
          RUNTIME_TAGS: ${{ needs.plan.outputs.runtime_tags }}
          LEGACY_TAG: ${{ needs.plan.outputs.legacy_tag }}
        run: |
          set -euo pipefail
          promote() { local image="$1" digest="$2" tags="$3" tag args=(); IFS=, read -r -a tag_list <<< "$tags"; for tag in "${tag_list[@]}"; do args+=(--tag "$image:$tag"); done; docker buildx imagetools create "${args[@]}" "$image@$digest"; for tag in "${tag_list[@]}"; do test "$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$image:$tag")" = "$digest"; done; }
          [ -z "$APP_DIGEST" ] || promote "$APP" "$APP_DIGEST" "$APP_TAGS"
          [ -z "$RUNTIME_DIGEST" ] || promote "$RUNTIME" "$RUNTIME_DIGEST" "$RUNTIME_TAGS"
          [ -z "$LEGACY_DIGEST" ] || promote "$APP" "$LEGACY_DIGEST" "$LEGACY_TAG"
      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'
        with: {cosign-release: v2.4.1}
      - name: Sign promoted immutable digests
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          APP: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          RUNTIME: ${{ env.REGISTRY }}/${{ env.IMAGE_RUNTIME_NAME }}
          APP_DIGEST: ${{ needs.candidate-main.outputs.digest }}
          RUNTIME_DIGEST: ${{ needs.candidate-runtime.outputs.digest }}
          LEGACY_DIGEST: ${{ needs.candidate-legacy.outputs.digest }}
        run: |
          set -euo pipefail
          [ -z "$APP_DIGEST" ] || cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$APP@$APP_DIGEST"
          [ -z "$RUNTIME_DIGEST" ] || cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$RUNTIME@$RUNTIME_DIGEST"
          [ -z "$LEGACY_DIGEST" ] || cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$APP@$LEGACY_DIGEST"
