    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ragtime</title>
    <script>
      // Apply persisted theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var allowedThemePacks = ['default', 'modern', 'serif'];
          var pack = localStorage.getItem('ragtime-theme-pack');
          if (pack === 'vscode') {
            pack = 'modern';
            localStorage.setItem('ragtime-theme-pack', pack);
          }
          if (allowedThemePacks.includes(pack) && pack !== 'default') {
            document.documentElement.setAttribute('data-theme-pack', pack);
          } else {
            document.documentElement.removeAttribute('data-theme-pack');
          }
          var mode = localStorage.getItem('ragtime-theme');
          if (mode === 'light' || mode === 'dark') {
            document.documentElement.setAttribute('data-theme', mode);
          }
        } catch (e) {
          /* localStorage unavailable (private mode); fall back to defaults */
        }
      })();
    </script>
